services:
  notifications-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Gemini__ApiKey: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in your environment or .env file}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.6-flash}
      Discord__WebhookUrl: ${DISCORD_WEBHOOK_URL:?Set DISCORD_WEBHOOK_URL in your environment or .env file}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    init: true
